image: node:20

variables:
  NODE_ENV: "test"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

stages:
  - test

install_dependencies:
  stage: test
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: test
  needs: ["install_dependencies"]
  script:
    - npm run lint
  allow_failure: false

typecheck:
  stage: test
  needs: ["install_dependencies"]
  script:
    - npm run type-check
  allow_failure: false

tests:
  stage: test
  needs: ["install_dependencies"]
  script:
    - npm run test:coverage
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files\s+\|\s+(\d+\.\d+)%/'

